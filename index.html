<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>픽사 스토리 자판기 | 작품·컨셉·인물·세계</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
:root{
  --color-primary:#006DD2; --color-primary-light:#E8F3FF;
  --color-secondary:#00A68A; --color-error:#D32F2F;
  --color-warning:#F57C00; --color-success:#388E3C;
  --color-pastel-blue:#BFD9F2; --color-pastel-green:#C8EDD9;
  --color-pastel-yellow:#FFF3B0; --color-pastel-pink:#FFD6E0;
  --color-pastel-blue-dark:#1A5F8A; --color-pastel-green-dark:#1A6B47;
  --color-pastel-yellow-dark:#7A6000; --color-pastel-pink-dark:#8A2840;
  --color-gray-900:#1A1A1A; --color-gray-700:#404040; --color-gray-500:#767676;
  --color-gray-300:#B2B2B2; --color-gray-100:#F5F5F5; --color-white:#FFFFFF;
  --border-radius-sm:4px; --border-radius-md:8px; --border-radius-lg:16px;
  --spacing-xs:4px; --spacing-sm:8px; --spacing-md:16px; --spacing-lg:24px; --spacing-xl:40px;
  --pad-side:16px;
  /* 자판기 전용 */
  --vm-body:#0E3A5C; --vm-body-2:#0A2A44; --vm-edge:#08243A;
  --vm-glass:#132B3F; --vm-glass-2:#0D2032;
  --vm-ledge:#1D5C8A; --vm-neon:#5FE3D0; --vm-btn:#123E5F;
  --vm-text:#DDEAF5; --vm-text-dim:#8FB0C9;
}
*{box-sizing:border-box;margin:0;padding:0;
  font-family:'Pretendard GOV','Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
h1,h2,h3,h4,p,span,li,td,th,a,button,div,label{word-break:keep-all;overflow-wrap:break-word;line-break:strict;}
html{-webkit-text-size-adjust:100%;}
body{font-size:16px;line-height:1.6;color:var(--color-gray-900);background:var(--color-gray-100);
  min-height:100vh;display:flex;flex-direction:column;}
main{flex:1;width:100%;}
.skip-link{position:fixed;left:12px;top:12px;z-index:100;transform:translateY(-160%);padding:10px 14px;
  border-radius:8px;background:var(--color-white);color:var(--color-primary);font-weight:800;text-decoration:none;
  box-shadow:0 4px 16px rgba(0,0,0,.24);}
.skip-link:focus{transform:translateY(0);}
.wrap{max-width:1120px;margin:0 auto;padding-left:var(--pad-side);padding-right:var(--pad-side);}
:focus-visible{outline:3px solid var(--color-secondary);outline-offset:2px;border-radius:var(--border-radius-sm);}
.material-icons-outlined{font-family:'Material Icons Outlined';font-style:normal;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* ── 페이지 헤더 ── */
.pagehead{padding:var(--spacing-lg) 0 var(--spacing-md);text-align:center;}
.pagehead .eyebrow{display:inline-flex;align-items:center;gap:6px;background:var(--color-white);
  color:var(--color-pastel-blue-dark);font-size:12px;font-weight:700;padding:6px 13px;
  border-radius:999px;margin-bottom:var(--spacing-sm);border:1px solid var(--color-gray-300);}
.pagehead .eyebrow .material-icons-outlined{font-size:15px;}
.pagehead h1{font-size:25px;line-height:1.3;font-weight:800;color:var(--color-gray-900);letter-spacing:-.5px;}
.pagehead p{margin:var(--spacing-sm) auto 0;font-size:14px;color:var(--color-gray-500);max-width:52ch;}

/* ── 자판기 본체 ── */
.machine{background:linear-gradient(180deg,var(--vm-body) 0%,var(--vm-body-2) 100%);
  border-radius:20px;border:3px solid var(--vm-edge);padding:14px;
  box-shadow:0 16px 40px rgba(8,36,58,.32), inset 0 2px 0 rgba(255,255,255,.09);}
.vm-top{display:flex;align-items:center;justify-content:space-between;gap:var(--spacing-sm);
  padding:0 4px 12px;flex-wrap:wrap;}
.vm-brand{display:flex;align-items:center;gap:8px;color:var(--vm-neon);font-size:14px;font-weight:800;letter-spacing:.5px;}
.vm-brand .material-icons-outlined{font-size:19px;}
.vm-lamps{display:flex;gap:6px;align-items:center;}
.lamp{width:9px;height:9px;border-radius:50%;background:var(--vm-neon);opacity:.85;}
.lamp.b{background:#F2C63C;} .lamp.c{background:#F0873C;}

/* 탭 = 자판기 상단 셀렉터 */
.vm-tabs{display:flex;gap:6px;padding:0 4px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.vm-tab{flex:0 0 auto;padding:10px 15px;border-radius:999px;border:1px solid rgba(95,227,208,.3);
  background:var(--vm-btn);color:var(--vm-text-dim);font-size:14px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:all .18s;}
.vm-tab .material-icons-outlined{font-size:18px;}
.vm-tab:hover{color:var(--vm-text);border-color:var(--vm-neon);}
.vm-tab[aria-selected="true"]{background:var(--vm-neon);color:#07322A;border-color:var(--vm-neon);}

/* ── 유리창 진열장 ── */
.vm-grid{display:grid;grid-template-columns:1fr;gap:12px;}
.glass{background:linear-gradient(180deg,var(--vm-glass) 0%,var(--vm-glass-2) 100%);
  border-radius:14px;border:2px solid rgba(95,227,208,.18);padding:12px 12px 4px;
  box-shadow:inset 0 3px 14px rgba(0,0,0,.45);position:relative;overflow:hidden;}
.glass::after{content:"";position:absolute;top:0;left:-30%;width:38%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.055),transparent);pointer-events:none;}
.shelf{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
  padding-bottom:12px;margin-bottom:12px;border-bottom:5px solid var(--vm-ledge);
  border-radius:0 0 3px 3px;box-shadow:0 3px 5px rgba(0,0,0,.28);}
.shelf:last-child{margin-bottom:6px;}
.slot{background:rgba(255,255,255,.05);border:1px solid rgba(95,227,208,.16);border-radius:10px;
  padding:7px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;
  transition:transform .18s,background .18s,border-color .18s;position:relative;}
.slot:hover,.slot:focus-visible{transform:translateY(-4px);background:rgba(95,227,208,.11);border-color:var(--vm-neon);}
.slot .ph{width:100%;aspect-ratio:5/7;border-radius:6px;overflow:hidden;background:#0A1826;}
.slot .ph svg{width:100%;height:100%;display:block;}
.slot .nm{font-size:13px;font-weight:700;color:var(--vm-text);line-height:1.35;}
.slot .yr{font-size:11px;color:var(--vm-text-dim);}
.slot .code{position:absolute;top:11px;right:11px;background:#07202F;color:var(--vm-neon);
  font-size:10px;font-weight:800;letter-spacing:1px;padding:3px 7px;border-radius:5px;
  border:1px solid rgba(95,227,208,.45);}
.glass .empty{grid-column:1/-1;text-align:center;padding:var(--spacing-xl) var(--spacing-md);
  color:var(--vm-text-dim);font-size:14px;}

/* ── 조작 패널 ── */
.panel{background:linear-gradient(180deg,#0C3350,#0A2A44);border-radius:14px;
  border:2px solid rgba(95,227,208,.16);padding:12px;display:flex;flex-direction:column;gap:12px;}
.panel{order:-1;}
.filter-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:28px;}
.result-count{font-size:12px;color:var(--vm-text-dim);}
.reset-filter{border:0;background:transparent;color:var(--vm-neon);font-size:12px;font-weight:700;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;}
.reset-filter[hidden]{display:none;}
.led{background:#04141F;border:2px solid rgba(95,227,208,.3);border-radius:9px;padding:11px 13px;
  min-height:62px;display:flex;flex-direction:column;justify-content:center;gap:3px;}
.led .l1{font-size:11px;color:var(--vm-text-dim);letter-spacing:1px;font-weight:700;}
.led .l2{font-size:19px;color:var(--vm-neon);font-weight:800;letter-spacing:2px;
  font-variant-numeric:tabular-nums;min-height:26px;}
.led .l3{font-size:11px;color:var(--vm-text-dim);}

.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.key{padding:11px 0;border-radius:8px;border:1px solid rgba(95,227,208,.22);background:var(--vm-btn);
  color:var(--vm-text);font-size:15px;font-weight:800;cursor:pointer;transition:all .12s;}
.key:hover{background:#17507A;border-color:var(--vm-neon);}
.key:active{transform:translateY(2px);}
.key.wide{grid-column:span 2;font-size:13px;}
.key.act{background:var(--vm-neon);color:#07322A;border-color:var(--vm-neon);}
.key.act:hover{background:#7BEEDC;}
.key.warn{background:#5C2A2A;border-color:rgba(240,135,60,.4);color:#FFD9BD;}
.key.warn:hover{background:#7A3838;}

.vm-search{position:relative;}
.vm-search .material-icons-outlined{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--vm-text-dim);font-size:19px;pointer-events:none;}
.vm-input{width:100%;padding:11px 12px 11px 38px;border:1px solid rgba(95,227,208,.25);
  border-radius:8px;font-size:16px;color:var(--vm-text);background:#08202F;outline:none;transition:border-color .2s;}
.vm-input::placeholder{color:#6A8DA6;}
.vm-input:focus{border-color:var(--vm-neon);box-shadow:0 0 0 3px rgba(95,227,208,.16);}

.pchips{display:flex;flex-wrap:wrap;gap:5px;}
.pchip{padding:7px 11px;border-radius:999px;border:1px solid rgba(95,227,208,.22);background:var(--vm-btn);
  font-size:12px;font-weight:700;color:var(--vm-text-dim);cursor:pointer;transition:all .16s;}
.pchip:hover{color:var(--vm-text);border-color:var(--vm-neon);}
.pchip[aria-pressed="true"]{background:var(--vm-neon);border-color:var(--vm-neon);color:#07322A;}

/* ── 출고구 ── */
.tray{background:#06182A;border-radius:12px;border:2px solid rgba(95,227,208,.14);
  padding:12px;box-shadow:inset 0 5px 16px rgba(0,0,0,.55);}
.tray .lb{font-size:11px;font-weight:800;color:var(--vm-text-dim);letter-spacing:1.5px;margin-bottom:9px;
  display:flex;align-items:center;gap:6px;}
.tray .lb .material-icons-outlined{font-size:15px;}
.tray .slotmouth{min-height:60px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.tray .hint{font-size:12px;color:#5F7F97;}
.dropped{display:flex;align-items:center;gap:9px;background:rgba(95,227,208,.11);
  border:1px solid rgba(95,227,208,.35);border-radius:9px;padding:7px 11px 7px 7px;cursor:pointer;}
.dropped .mini{width:30px;height:42px;border-radius:4px;overflow:hidden;flex:0 0 30px;}
.dropped .mini svg{width:100%;height:100%;display:block;}
.dropped .tx{font-size:13px;font-weight:700;color:var(--vm-text);}
.dropped .tx small{display:block;font-size:11px;font-weight:500;color:var(--vm-text-dim);}
@keyframes drop{0%{transform:translateY(-26px);opacity:0}60%{transform:translateY(4px);opacity:1}100%{transform:translateY(0)}}
.dropped.anim{animation:drop .42s cubic-bezier(.3,1.2,.5,1);}

.vm-foot{padding:10px 4px 0;font-size:11px;color:var(--vm-text-dim);text-align:center;}
.tab-count{min-width:20px;height:20px;padding:0 6px;display:inline-grid;place-items:center;border-radius:999px;
  background:rgba(255,255,255,.13);font-size:11px;line-height:1;}
.vm-tab[aria-selected="true"] .tab-count{background:rgba(7,50,42,.14);}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));z-index:90;transform:translate(-50%,20px);
  width:max-content;max-width:calc(100% - 32px);padding:11px 16px;border-radius:999px;background:#04141F;
  color:var(--color-white);font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;
  pointer-events:none;transition:opacity .2s,transform .2s;}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* ── 비교 트레이 뷰 ── */
.cmp-wrap{padding:2px 0 0;}
.cmp-note{font-size:13px;color:var(--vm-text-dim);padding:0 4px 10px;}
.cmp-note strong{color:var(--vm-neon);}
.cmp-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;scroll-snap-type:x proximity;}
.cmp-cols{display:flex;gap:11px;min-width:min-content;}
.cmp-col{flex:0 0 262px;max-width:262px;scroll-snap-align:start;border-radius:12px;overflow:hidden;
  background:var(--color-white);border:1px solid var(--color-gray-300);}
.cmp-col .top{padding:12px 14px;background:var(--color-pastel-blue);color:var(--color-pastel-blue-dark);}
.cmp-col .top .t{font-size:16px;font-weight:800;line-height:1.35;}
.cmp-col .top .y{font-size:11px;opacity:.85;margin-top:2px;}
.cmp-row{padding:12px 14px;border-top:1px solid var(--color-gray-100);}
.cmp-row .lb{font-size:10px;font-weight:800;color:var(--color-gray-500);letter-spacing:.8px;margin-bottom:6px;}
.cmp-row .vl{font-size:13px;color:var(--color-gray-900);}
.cmp-row ul{list-style:none;display:flex;flex-direction:column;gap:5px;}
.cmp-row li{font-size:12px;color:var(--color-gray-700);padding-left:11px;position:relative;}
.cmp-row li::before{content:"";position:absolute;left:0;top:7px;width:4px;height:4px;border-radius:50%;background:var(--color-gray-300);}
.cmp-row .num{font-size:18px;font-weight:800;color:var(--color-primary);}
.cmp-row .num small{font-size:12px;color:var(--color-gray-500);font-weight:600;}

.sum-list{display:grid;gap:9px;}
.sum-item{background:var(--color-white);border:1px solid var(--color-gray-300);border-radius:12px;
  padding:13px;display:grid;gap:6px;}
.sum-item .hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:7px;}
.sum-item .cd{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--color-pastel-blue-dark);
  background:var(--color-primary-light);padding:2px 7px;border-radius:4px;}
.sum-item .tt{font-size:15px;font-weight:800;}
.sum-item .yy{font-size:12px;color:var(--color-gray-500);}
.sum-item .th{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:var(--color-pastel-yellow);color:var(--color-pastel-yellow-dark);}
.sum-item .ln{font-size:13px;color:var(--color-gray-700);}
.sum-item .dv{font-size:12px;color:var(--color-pastel-blue-dark);background:var(--color-primary-light);
  border-radius:var(--border-radius-sm);padding:8px 10px;}
.sum-item .st{font-size:11px;color:var(--color-gray-500);}

/* ── 상세 패널 (제품 라벨) ── */
.overlay{position:fixed;inset:0;background:rgba(6,20,32,.68);display:none;z-index:50;
  overflow-y:auto;-webkit-overflow-scrolling:touch;}
.overlay.open{display:block;}
.sheet{max-width:860px;margin:0 auto;background:var(--color-white);min-height:100vh;}
.sheet-top{position:relative;padding:var(--spacing-lg) var(--pad-side) var(--spacing-md);
  display:flex;gap:var(--spacing-md);flex-wrap:wrap;align-items:flex-start;}
.sheet-poster{width:104px;flex:0 0 104px;border-radius:var(--border-radius-md);overflow:hidden;
  box-shadow:0 4px 14px rgba(0,0,0,.2);}
.sheet-poster svg{width:100%;height:auto;display:block;}
.sheet-head{flex:1 1 180px;min-width:160px;padding-right:44px;}
.sheet-head .slotcode{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1.4px;
  color:var(--color-pastel-blue-dark);background:var(--color-primary-light);
  padding:3px 8px;border-radius:4px;margin-bottom:6px;}
.sheet-head h2{font-size:21px;line-height:1.35;font-weight:800;}
.sheet-head .en{font-size:12px;color:var(--color-gray-500);margin-top:3px;}
.sheet-head .en .yr{color:var(--color-gray-700);font-weight:700;}
.sheet-head .line{margin-top:var(--spacing-sm);font-size:15px;font-weight:700;color:var(--color-pastel-pink-dark);}
.sheet-head .line .orig{display:block;margin-top:4px;font-size:11px;font-weight:500;
  color:var(--color-gray-500);font-style:italic;word-break:break-word;}
.close-btn{position:absolute;top:var(--spacing-md);right:var(--pad-side);width:42px;height:42px;
  border-radius:999px;border:1px solid var(--color-gray-300);background:var(--color-white);
  cursor:pointer;display:grid;place-items:center;color:var(--color-gray-700);z-index:2;}
.close-btn:hover{background:var(--color-gray-100);color:var(--color-gray-900);}
.sheet-act{padding:0 var(--pad-side) var(--spacing-md);}
.btn{display:inline-flex;align-items:center;gap:var(--spacing-xs);padding:10px var(--spacing-md);
  border-radius:var(--border-radius-md);font-size:14px;font-weight:700;cursor:pointer;border:none;transition:all .2s;}
.btn .material-icons-outlined{font-size:17px;}
.btn-secondary{background:var(--color-gray-100);color:var(--color-gray-700);border:1px solid var(--color-gray-300);}
.btn-secondary:hover{background:var(--color-white);border-color:var(--color-primary);color:var(--color-primary);}

.section{padding:0 var(--pad-side) var(--spacing-lg);}
.section h3{display:flex;align-items:center;gap:8px;font-size:17px;line-height:1.4;font-weight:700;
  margin-bottom:var(--spacing-md);padding-top:var(--spacing-lg);border-top:1px solid var(--color-gray-100);}
.section h3 .material-icons-outlined{font-size:20px;color:var(--color-primary);}
.section h3 .cnt{font-size:13px;color:var(--color-gray-500);font-weight:600;}
.concept{background:var(--color-pastel-blue);color:var(--color-pastel-blue-dark);
  border-radius:var(--border-radius-md);padding:var(--spacing-md);font-size:15px;}
.concept + .concept{margin-top:var(--spacing-sm);background:var(--color-pastel-yellow);color:var(--color-pastel-yellow-dark);}
.concept strong{display:block;font-size:12px;font-weight:800;margin-bottom:5px;opacity:.85;}
.people{display:grid;gap:var(--spacing-sm);}
.person{border:1px solid var(--color-gray-300);border-radius:var(--border-radius-md);padding:var(--spacing-md);}
.person .row{display:flex;flex-wrap:wrap;align-items:baseline;gap:7px;margin-bottom:5px;}
.person .nm{font-size:15px;font-weight:700;}
.person .rl{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:var(--color-pastel-pink);color:var(--color-pastel-pink-dark);}
.person .ds{font-size:14px;color:var(--color-gray-700);}
.worlds{display:grid;gap:var(--spacing-sm);}
.world{background:var(--color-pastel-green);border-radius:var(--border-radius-md);padding:var(--spacing-md);}
.world .nm{font-size:15px;font-weight:700;color:var(--color-pastel-green-dark);margin-bottom:5px;}
.world .ds{font-size:14px;color:#14563A;}
.note{margin:0 var(--pad-side) var(--spacing-md);background:var(--color-gray-100);
  border-left:4px solid var(--color-primary);padding:var(--spacing-md);font-size:13px;color:var(--color-gray-700);}
.note strong{color:var(--color-primary);}
.src{padding:0 var(--pad-side) var(--spacing-xl);font-size:12px;color:var(--color-gray-500);}
.src a{color:var(--color-primary);}

/* ── 푸터 ── */
.chichiboo-footer{width:100%;padding:var(--spacing-md) var(--pad-side);background:var(--color-gray-100);
  border-top:1px solid var(--color-gray-300);text-align:center;margin-top:var(--spacing-xl);}
.chichiboo-footer a{display:inline-flex;align-items:center;gap:var(--spacing-xs);font-size:13px;
  color:var(--color-gray-500);text-decoration:none;transition:color .2s;}
.chichiboo-footer a:hover{color:var(--color-primary);}
.chichiboo-footer .material-icons-outlined{font-size:16px;}

/* ── 반응형 ── */
@media (min-width:480px){
  :root{--pad-side:20px;}
  .pagehead h1{font-size:28px;}
  .shelf{grid-template-columns:repeat(3,1fr);}
  .slot .nm{font-size:14px;}
}
@media (min-width:768px){
  :root{--pad-side:24px;}
  .machine{padding:18px;border-radius:24px;}
  .pagehead{padding:var(--spacing-xl) 0 var(--spacing-lg);}
  .pagehead h1{font-size:32px;}
  .pagehead p{font-size:15px;}
  .vm-grid{grid-template-columns:1fr 288px;gap:14px;align-items:start;}
  .panel{order:0;}
  .shelf{grid-template-columns:repeat(4,1fr);gap:12px;}
  .panel{position:sticky;top:14px;}
  .worlds,.people{grid-template-columns:1fr 1fr;}
  .overlay{padding:var(--spacing-md);}
  .sheet{margin:var(--spacing-lg) auto;min-height:0;border-radius:var(--border-radius-lg);overflow:hidden;}
  .sheet-top{gap:var(--spacing-lg);}
  .sheet-poster{width:150px;flex:0 0 150px;}
  .sheet-head{flex:1 1 260px;padding-right:52px;}
  .sheet-head h2{font-size:23px;}
  .cmp-col{flex:0 0 296px;max-width:296px;}
  .sum-list{grid-template-columns:1fr 1fr;}

/* ── 파생 데이터 (작품 추가 시 자동 반영) ───────────────────── */
FILMS.sort((a,b)=>a.year-b.year);
FILMS.forEach(f=>{ if(!f.poster) f.poster = AUTO_POSTER(f); });

const SLOT_COLS = 4;                                   // 슬롯 코드 열 개수 (A1~A4, B1~B4 …)
const ROW_LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
FILMS.forEach((f,i)=>{ f.code = ROW_LETTERS[Math.floor(i/SLOT_COLS)] + ((i%SLOT_COLS)+1); });

const oneLine = f => (f.concept.split(/(?<=다\.)\s|(?<=[.。])\s/)[0] || f.concept).trim();
const THEMES = ['전체', ...new Set(FILMS.map(f=>f.theme))];
const ROWS = [...new Set(FILMS.map(f=>f.code[0]))];     // 사용 중인 행 문자
const MAX_CMP = 4;

/* ── 상태 ── */
let activeTheme='전체', query='', cmpSel=[], entry='', history=[];

/* ── DOM ── */
const $ = id => document.getElementById(id);
const glass=$('glass'), chipsBox=$('chips'), overlay=$('overlay'), sheet=$('sheet');
const ledCode=$('ledCode'), ledMsg=$('ledMsg'), trayEl=$('tray');
const cmpChips=$('cmpChips'), cmpBody=$('cmpBody'), cmpNote=$('cmpNote');
const resultCount=$('resultCount'), resetFilter=$('resetFilter'), toast=$('toast');
let lastFocused=null;
let toastTimer=null;

$('heroDesc').innerHTML = `${FILMS.length}편의 작품을 <strong>컨셉 · 등장인물 · 세계</strong> 세 축으로 정리했습니다. `
 + `진열대에서 한 편을 뽑거나, 비교 트레이에 여러 편을 올려 나란히 살펴보세요.`;

/* ── 탭 ── */
function setTab(name){
  const galleryActive=name==='gallery';
  $('tabGallery').setAttribute('aria-selected', galleryActive);
  $('tabCompare').setAttribute('aria-selected', !galleryActive);
  $('tabGallery').tabIndex=galleryActive?0:-1;
  $('tabCompare').tabIndex=galleryActive?-1:0;
  $('viewGallery').hidden = name!=='gallery';
  $('viewCompare').hidden = name!=='compare';
  if(name==='compare') renderCompare();
}
$('tabGallery').onclick=()=>setTab('gallery');
$('tabCompare').onclick=()=>setTab('compare');
$('tabCompare').tabIndex=-1;
$('tabGallery').parentElement.addEventListener('keydown',e=>{
  if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return;
  e.preventDefault();
  const toCompare=e.key==='ArrowRight'||e.key==='End';
  setTab(toCompare?'compare':'gallery');
  $(toCompare?'tabCompare':'tabGallery').focus();
});

/* ── 필터 ── */
THEMES.forEach(t=>{
  const b=document.createElement('button');
  b.className='pchip'; b.type='button'; b.textContent=t;
  b.setAttribute('aria-pressed', t===activeTheme);
  b.onclick=()=>{activeTheme=t;
    [...chipsBox.children].forEach(c=>c.setAttribute('aria-pressed', c.textContent===t));
    renderShelves();};
  chipsBox.appendChild(b);
});

function matches(f){
  if(activeTheme!=='전체' && f.theme!==activeTheme) return false;
  if(!query) return true;
  const q=query.toLowerCase();
  const hay=[f.code,f.ko,f.en,String(f.year),f.theme,f.tagline,f.taglineKo,f.concept,f.core,
    ...f.people.map(p=>p.n+' '+p.r+' '+p.d),
    ...f.worlds.map(w=>w.n+' '+w.d)].join(' ').toLowerCase();
  return hay.includes(q);
}

/* ── 진열대 ── */
function renderShelves(){
  const list=FILMS.filter(matches);
  resultCount.textContent=`전체 ${FILMS.length}편 중 ${list.length}편 표시`;
  resetFilter.hidden=!query && activeTheme==='전체';
  if(!list.length){
    glass.innerHTML='<p class="empty">해당하는 상품이 없습니다.<br>검색어나 주제를 바꿔 보세요.</p>';
    setLed(null,'조건에 맞는 상품 없음'); return;
  }
  let html='';
  for(let i=0;i<list.length;i+=SLOT_COLS){
    html+='<div class="shelf">'+list.slice(i,i+SLOT_COLS).map(f=>`
      <button class="slot" type="button" data-id="${f.id}" aria-label="${f.code} ${f.ko} ${f.year} 뽑기">
        <span class="code">${f.code}</span>
        <span class="ph">${f.poster}</span>
        <span class="nm">${f.ko}</span>
        <span class="yr">${f.en} · ${f.year}</span>
      </button>`).join('')+'</div>';
  }
  glass.innerHTML=html;
  glass.querySelectorAll('.slot').forEach(b=>{
    b.onclick=()=>dispense(FILMS.find(f=>f.id===b.dataset.id), b);
  });
  setLed(null, `${list.length}개 상품 진열 중`);
}
$('q').addEventListener('input', e=>{ query=e.target.value.trim(); renderShelves(); });
resetFilter.onclick=()=>{
  query=''; activeTheme='전체'; $('q').value='';
  [...chipsBox.children].forEach(c=>c.setAttribute('aria-pressed',c.textContent==='전체'));
  renderShelves(); $('q').focus();
};

function showToast(message){
  toast.textContent=message; toast.classList.add('show'); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove('show'),2600);
}

/* ── LED · 키패드 ── */
function setLed(code,msg){
  ledCode.textContent = code || (entry ? entry+'_' : '- -');
  if(msg) ledMsg.textContent = msg;
}
function buildKeypad(){
  const kp=$('keypad'); kp.innerHTML='';
  ROWS.forEach(r=>{
    const b=document.createElement('button');
    b.className='key'; b.type='button'; b.textContent=r;
    b.onclick=()=>press(r); kp.appendChild(b);
  });
  for(let n=1;n<=SLOT_COLS;n++){
    const b=document.createElement('button');
    b.className='key'; b.type='button'; b.textContent=n;
    b.onclick=()=>press(String(n)); kp.appendChild(b);
  }
  const rnd=document.createElement('button');
  rnd.className='key wide act'; rnd.type='button'; rnd.textContent='랜덤 뽑기';
  rnd.onclick=()=>{ const f=FILMS[Math.floor(Math.random()*FILMS.length)];
    entry=''; dispense(f); };
  kp.appendChild(rnd);
  const clr=document.createElement('button');
  clr.className='key wide warn'; clr.type='button'; clr.textContent='취소';
  clr.onclick=()=>{ entry=''; setLed(null,'입력을 지웠습니다'); };
  kp.appendChild(clr);
}
function press(ch){
  if(/[A-Z]/.test(ch)){ entry=ch; setLed(null,'번호를 눌러 주세요'); }
  else {
    if(!entry){ setLed(null,'먼저 행 문자를 눌러 주세요'); return; }
    entry+=ch;
    const f=FILMS.find(x=>x.code===entry);
    if(f){ const code=entry; entry=''; setLed(code,'출고 중…'); dispense(f); }
    else { setLed(entry,'없는 코드입니다'); entry=''; }
    return;
  }
  setLed();
}

/* ── 출고 ── */
function dispense(f, trigger){
  if(!f) return;
  history = [f, ...history.filter(x=>x.id!==f.id)].slice(0,4);
  renderTray(true);
  setLed(f.code, `${f.ko} 출고 완료`);
  openSheet(f, trigger);
}
function renderTray(anim){
  if(!history.length){ trayEl.innerHTML='<span class="hint">아직 뽑은 작품이 없습니다.</span>'; return; }
  trayEl.innerHTML = history.map((f,i)=>`
    <button class="dropped ${anim&&i===0?'anim':''}" type="button" data-id="${f.id}" aria-label="${f.ko} 다시 보기">
      <span class="mini">${f.poster}</span>
      <span class="tx">${f.ko}<small>${f.code} · ${f.year}</small></span>
    </button>`).join('');
  trayEl.querySelectorAll('.dropped').forEach(b=>{
    b.onclick=()=>openSheet(FILMS.find(f=>f.id===b.dataset.id), b);
  });
}

/* ── 상세 (제품 라벨) ── */
function openSheet(f, trigger){
  if(!f) return;
  lastFocused=trigger||null;
  const inCmp = cmpSel.includes(f.id);
  sheet.innerHTML=`
  <div class="sheet-top">
    <button class="close-btn" type="button" aria-label="닫기" onclick="closeSheet()"><span class="material-icons-outlined">close</span></button>
    <div class="sheet-poster">${f.poster}</div>
    <div class="sheet-head">
      <span class="slotcode">SLOT ${f.code}</span>
      <h2 id="sheetTitle">${f.ko}</h2>
      <p class="en">${f.en} · <span class="yr">${f.year}</span> · ${f.theme}</p>
      <p class="line">“${f.taglineKo}”<span class="orig">${f.tagline}</span></p>
    </div>
  </div>
  <div class="sheet-act">
    <button class="btn btn-secondary" type="button" id="addCmp">
      <span class="material-icons-outlined">${inCmp?'remove_circle_outline':'add_circle_outline'}</span>
      ${inCmp?'비교 트레이에서 빼기':'비교 트레이에 담기'}</button>
  </div>
  <section class="section">
    <h3><span class="material-icons-outlined">lightbulb</span>컨셉</h3>
    <div class="concept"><strong>이야기의 출발점</strong>${f.concept}</div>
    <div class="concept"><strong>창작 관점에서 눈여겨볼 점</strong>${f.core}</div>
  </section>
  <section class="section">
    <h3><span class="material-icons-outlined">groups</span>등장인물 <span class="cnt">${f.people.length}명</span></h3>
    <div class="people">${f.people.map(p=>`
      <div class="person"><div class="row"><span class="nm">${p.n}</span><span class="rl">${p.r}</span></div>
      <p class="ds">${p.d}</p></div>`).join('')}</div>
  </section>
  <section class="section">
    <h3><span class="material-icons-outlined">public</span>세계 <span class="cnt">${f.worlds.length}곳</span></h3>
    <div class="worlds">${f.worlds.map(w=>`
      <div class="world"><p class="nm">${w.n}</p><p class="ds">${w.d}</p></div>`).join('')}</div>
  </section>
  <p class="note"><strong>포스터 안내</strong> — 공식 포스터는 저작권 보호 대상이므로, 각 작품의 컨셉과 색채를 바탕으로 제작한 오리지널 추상 이미지를 사용했습니다.</p>
  <p class="src">정보 출처: <a href="${f.src}" target="_blank" rel="noopener noreferrer">Pixar Animation Studios 공식 사이트</a><br>${f.src}</p>`;
  $('addCmp').onclick=()=>{ toggleCmp(f.id); openSheet(f, lastFocused); };
  overlay.classList.add('open');
  document.querySelector('main').setAttribute('inert','');
  document.querySelector('footer').setAttribute('inert','');
  document.body.style.overflow='hidden';
  sheet.querySelector('.close-btn').focus();
}
function closeSheet(){
  overlay.classList.remove('open');
  document.querySelector('main').removeAttribute('inert');
  document.querySelector('footer').removeAttribute('inert');
  document.body.style.overflow='';
  if(lastFocused && document.contains(lastFocused)) lastFocused.focus();
}
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeSheet(); });
document.addEventListener('keydown', e=>{
  if(!overlay.classList.contains('open')) return;
  if(e.key==='Escape'){ closeSheet(); return; }
  if(e.key!=='Tab') return;
  const focusable=[...sheet.querySelectorAll('button,a[href],[tabindex]:not([tabindex="-1"])')];
  if(!focusable.length) return;
  const first=focusable[0], last=focusable[focusable.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
});

/* ── 비교 트레이 ── */
function buildCmpChips(){
  cmpChips.innerHTML='';
  FILMS.forEach(f=>{
    const b=document.createElement('button');
    b.className='pchip'; b.type='button'; b.dataset.id=f.id;
    b.textContent=`${f.code} ${f.ko}`;
    b.setAttribute('aria-pressed', cmpSel.includes(f.id));
    b.onclick=()=>{ toggleCmp(f.id); };
    cmpChips.appendChild(b);
  });
}
function toggleCmp(id){
  const i=cmpSel.indexOf(id);
  if(i>=0) cmpSel.splice(i,1);
  else {
    if(cmpSel.length>=MAX_CMP){ showToast(`최대 ${MAX_CMP}편까지 비교할 수 있습니다.`); return false; }
    cmpSel.push(id);
  }
  renderCompare();
  return true;
}
$('cmpClear').onclick=()=>{ cmpSel=[]; renderCompare(); };
$('cmpRandom').onclick=()=>{ cmpSel=[...FILMS].sort(()=>Math.random()-.5).slice(0,3).map(f=>f.id); renderCompare(); };

function renderCompare(){
  [...cmpChips.children].forEach(c=>c.setAttribute('aria-pressed', cmpSel.includes(c.dataset.id)));
  $('cmpCount').textContent=cmpSel.length;
  $('cmpCount').setAttribute('aria-label',`${cmpSel.length}편 선택됨`);

  if(cmpSel.length===0){
    cmpNote.innerHTML = `트레이가 비어 있어 <strong>전체 ${FILMS.length}편</strong>의 한 줄 요약을 보여 줍니다. 아래에서 작품을 담으면 항목별로 나란히 비교합니다.`;
    cmpBody.innerHTML = `<div class="sum-list">${FILMS.map(f=>`
      <article class="sum-item">
        <div class="hd"><span class="cd">${f.code}</span><span class="tt">${f.ko}</span>
          <span class="yy">${f.year}</span><span class="th">${f.theme}</span></div>
        <p class="ln">${oneLine(f)}</p>
        <p class="dv">${f.core}</p>
        <p class="st">인물 ${f.people.length}명 · 세계 ${f.worlds.length}곳</p>
      </article>`).join('')}</div>`;
    return;
  }

  const sel = FILMS.filter(f=>cmpSel.includes(f.id));
  cmpNote.innerHTML = sel.length===1
    ? '한 편 더 담으면 나란히 비교됩니다. 좌우로 밀어 살펴보세요.'
    : `<strong>${sel.length}편</strong>을 비교 중입니다. 좌우로 밀어 살펴보세요. (최대 ${MAX_CMP}편)`;

  const row=(lb,html)=>`<div class="cmp-row"><p class="lb">${lb}</p>${html}</div>`;
  cmpBody.innerHTML = `<div class="cmp-scroll"><div class="cmp-cols">${sel.map(f=>`
    <article class="cmp-col">
      <div class="top"><p class="t">${f.code} · ${f.ko}</p><p class="y">${f.en} · ${f.year} · ${f.theme}</p></div>
      ${row('컨셉 문장', `<p class="vl">“${f.taglineKo}”</p>`)}
      ${row('이야기의 출발점', `<p class="vl">${oneLine(f)}</p>`)}
      ${row('창작 장치', `<p class="vl">${f.core}</p>`)}
      ${row(`주요 인물 (총 ${f.people.length}명)`, `<ul>${f.people.slice(0,4).map(p=>`<li><strong>${p.n}</strong> — ${p.r}</li>`).join('')}</ul>`)}
      ${row(`주요 세계 (총 ${f.worlds.length}곳)`, `<ul>${f.worlds.slice(0,4).map(w=>`<li>${w.n}</li>`).join('')}</ul>`)}
      ${row('규모', `<p class="num">${f.people.length}<small> 인물</small> &nbsp; ${f.worlds.length}<small> 세계</small></p>`)}
    </article>`).join('')}</div></div>`;
}

/* ── 초기화 ── */
buildKeypad();
buildCmpChips();
renderShelves();
renderTray(false);
renderCompare();
</script>
</body>
</html>
